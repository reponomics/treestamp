# Dedicated preview app configuration; see MAINTENANCE.md.
# Deploy from the repository root so both projects are in the build context:
#   flyctl deploy --config web/fly.preview.toml --dockerfile web/Dockerfile
app = "reponomics-treestamp-preview"
primary_region = "ewr"

[env]
  PORT = "8000"
  PUBLIC_BASE_URL = "https://reponomics-treestamp-preview.fly.dev"
  TRUST_PROXY = "1"
  FLY_SESSION_ROUTING = "true"
  CLIENT_IP_HEADER = "Fly-Client-IP"
  CACHE_MAX_ENTRIES = "300000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "10s"
    timeout = "3s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
