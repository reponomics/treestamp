[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "treestamp-web"
version = "0.1.1"
description = "Online editor for creating and maintaining directory trees for project documentation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "treestamp",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "certifi>=2026.10.19",
    "PyJWT[crypto]>=2.8,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.14",
]
browser = ["pytest-playwright>=0.5"]

[tool.uv.sources]
treestamp = { workspace = true }

[project.urls]
Homepage = "https://treestamp.reponomics.org"
Repository = "https://github.com/reponomics/treestamp"
Issues = "https://github.com/reponomics/treestamp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/treestamp_web"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TC"]
ignore = ["UP006", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "TC", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["treestamp", "treestamp_web"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["treestamp_web"]
mypy_path = "src:../src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../src", "scripts"]
markers = ["browser: drives the page in a real browser; needs pytest-playwright"]
# The Playwright plugin runs an event loop that breaks asyncio.run in the other
# tests, so browser tests only run in their own process: `make web-browser-test`.
addopts = "-p no:playwright -m 'not browser'"

[tool.coverage.run]
source = ["treestamp_web"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
