[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "treestamp"
version = "0.4.0"
description = "Generate and maintain directory trees for project documentation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Reponomics" },
]
keywords = ["readme", "documentation", "directory-tree", "pre-commit", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["textual>=8.2.8,<9"]

[dependency-groups]
build = ["build>=1.2", "hatchling==1.32.4", "editables>=0.3,<1"]
runtime-tools = ["pip>=26.2.2", "certifi>=2026.10.19"]

[tool.uv]
default-groups = ["build", "runtime-tools"]

[tool.uv.workspace]
members = ["web"]

[project.optional-dependencies]
dev = [
    "pip>=26.2.2",
    "certifi>=2026.10.19",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "build>=1.2",
    "twine>=6",
]

[project.scripts]
treestamp = "treestamp.cli:main"

[project.urls]
Homepage = "https://treestamp.reponomics.org"
Documentation = "https://github.com/reponomics/treestamp#readme"
Repository = "https://github.com/reponomics/treestamp"
Issues = "https://github.com/reponomics/treestamp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/treestamp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/treestamp/*.py",
    "/src/treestamp/py.typed",
    "/tests/*.py",
    "/scripts/changed_tests.py",
    "/scripts/check_docs.py",
    "/scripts/distribution_check.py",
    "/scripts/hook_check.py",
    "/scripts/installed_editor_check.py",
    "/scripts/release_check.py",
    "/scripts/readme_styles.py",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/PRIVACY.md",
    "/docs/MAINTENANCE.md",
    "/CHANGELOG.md",
    "/Makefile",
    "/.gitignore",
    "/.python-version",
    "/.pre-commit-config.yaml",
    "/.pre-commit-hooks.yaml",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
]
ignore = [
    "UP006", # retain existing annotation style
    "UP007",
    "E203", # permit space before colon in list comprehension
]

[tool.ruff.lint.per-file-ignores]
# verbatim integration snippets and rendered-tree fixtures overflow 88 cols
"tests/*" = ["E501", "TC"]

[tool.ruff.lint.isort]
known-first-party = ["treestamp"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["treestamp"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["treestamp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
