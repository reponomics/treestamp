name: README tree check

on:
  workflow_dispatch:
    # Select the branch in Run workflow so the check attaches to that revision.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # No Markdown-only filter: source-only changes must also be checked.

permissions:
  contents: read

concurrency:
  group: treestamp-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: README tree freshness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out the exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: true
      - name: Set up the pinned uv version
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: .tool-versions
      - name: Install Treestamp from this checkout
        run: make install
      - name: Check the README without writing
        run: venv/bin/treestamp check README.md
