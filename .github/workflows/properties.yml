name: Extended Hypothesis tests

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-properties-${{ github.ref }}
  cancel-in-progress: false

jobs:
  properties:
    name: Explore generated document, transport, and parser cases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Read the uv version pinned by the Docker image
        id: uv
        run: python scripts/check_toolchain.py
      - name: Set up the pinned uv version
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: false
      - name: Install development environment
        run: make install
      - name: Run extended property suites
        run: make test-properties-extended
