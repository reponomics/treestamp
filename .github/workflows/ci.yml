name: Treestamp CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: treestamp-ci-${{ github.event.pull_request.number || github.ref }}
  # A new PR revision supersedes its checks; let main-branch checks finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regression:
    name: Regression suite (Linux, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # Keep the primary version aligned with .python-version.
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: Check development and Docker uv pins
        run: make toolchain-check
      - name: Set up the pinned uv version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          python-version: ${{ matrix.python-version }}
      - name: Install pinned actionlint
        if: matrix.python-version == '3.11'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make actionlint-install
      - name: Run the shared core and package PR checkpoint
        if: matrix.python-version == '3.11'
        # This phase installs dependencies and builds fresh temporary artifacts.
        run: make _check-pr-core
      - name: Install the compatibility environment and build distributions
        if: matrix.python-version != '3.11'
        run: make build
      - name: Run compatibility regression and README checks
        if: matrix.python-version != '3.11'
        run: make test integration-check

  windows:
    name: Regression suite (Windows, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      UV_PROJECT_ENVIRONMENT: venv
    defaults:
      run:
        # Git Bash, so the steps read the same as the Linux ones. The Makefile
        # is not reused: its targets hard-code the POSIX `venv/bin` layout.
        shell: bash
    steps:
      - name: Check out the requested commit
        # Left on the runner's `core.autocrlf`, which Git for Windows sets to
        # true, so the working tree this job checks is a genuine CRLF checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: Check development and Docker uv pins
        run: python scripts/check_toolchain.py
      - name: Set up the pinned uv version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          python-version: ${{ matrix.python-version }}
      - name: Install the locked workspace and build tools
        run: |
          uv sync --locked --all-packages --all-extras --no-install-workspace --no-build
          uv sync --locked --all-packages --all-extras --no-build-isolation
          python -c "from pathlib import Path; print(Path('venv/Scripts').resolve())" >> "$GITHUB_PATH"
      - name: Report the line-ending facts this platform decides
        # Recorded rather than asserted: the suite pins treestamp's own bytes, and
        # these say which platform behaviour it is pinning them against.
        run: |
          echo "core.autocrlf: $(git config --get core.autocrlf || echo unset)"
          python -c "import os; print('os.linesep:', repr(os.linesep))"
          python -c "print('probe')" > probe.txt
          python -c "print('print() redirected:', repr(open('probe.txt','rb').read()))"
          python -c "import sys; sys.stdout.write('x\n')" > probe.txt
          python -c "print('stdout.write redirected:', repr(open('probe.txt','rb').read()))"
          python -c "print('README on disk:', repr(open('README.md','rb').read()[:40]))"
          rm -f probe.txt
      - name: Run the regression suite
        run: python -m pytest
      - name: Check the treestamped README against a CRLF working tree
        run: |
          python -m treestamp check README.md
          python scripts/readme_styles.py
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Verify clean headless installations
        run: python scripts/distribution_check.py

  hosted:
    name: Hosted editor (Linux, Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Check development and Docker uv pins
        run: make toolchain-check
      - name: Set up the pinned uv version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install both projects
        run: make install
      - name: Install the browser
        run: venv/bin/playwright install --with-deps chromium
      - name: Run the shared hosted PR checkpoint
        # The same phase is used by make check:pr; parallelism keeps browser
        # journeys concurrent with the other gates, with output grouped by target.
        run: make -j2 --output-sync=target _check-pr-web
      - name: Start the container and probe health
        run: |
          docker run -d --name treestamp-web -p 8000:8000 \
            -e GITHUB_RATE_RESERVE=0 -e GITHUB_API_URL=http://127.0.0.1:9 treestamp-web:local
          for _attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs treestamp-web
          exit 1
      - name: Stop and remove the container
        if: always()
        run: docker rm -f treestamp-web || true
