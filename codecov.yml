# Codecov reports coverage only. `make cov` and `make web-cov` enforce the
# minimum in CI; see docs/testing.md. Codecov's status checks are informational.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, flags"
  require_changes: true

flags:
  core:
    paths: [src/treestamp/]
    carryforward: true
  web:
    paths: [web/src/treestamp_web/]
    carryforward: true

# The hosted editor's report is generated from web/ and lists files as
# src/treestamp_web/...; map them to their repository paths.
fixes:
  - "src/treestamp_web/::web/src/treestamp_web/"
